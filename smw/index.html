<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        EJS_player = "#game";
        EJS_core = "snes";
        EJS_gameName = "Super Mario World";
        EJS_color = "#b9ffb8";
        EJS_startOnLoaded = true;

        // CDN path for cores, assets, and engine components
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

        // Path to your local ROM file (must match exact relative location and case)
        EJS_gameUrl = "roms/smw.zip"; 
    </script>
    <!-- Core script loader -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
