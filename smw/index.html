<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            #game {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>

        <script>
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_gameName = "Super Mario World";
            EJS_color = "#b9ffb8";
            EJS_startOnLoaded = true;
            
            // Point to the CDN asset directory
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Path relative to your web server root
            EJS_gameUrl = "roms/smw.zip";
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
