<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario 64</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        EJS_player = "#game";
        EJS_core = "n64";
        EJS_gameName = "Super Mario 64";
        EJS_color = "#c8febe";
        EJS_startOnLoaded = true;

        // Disables multithreading to prevent memory allocation crashes on N64
        EJS_threads = false;

        // Uses CDN mirror for reliable WASM delivery
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/";

        // Absolute URL to eliminate all pathing issues
        EJS_gameUrl = "/english/roms/sm64.z64";
    </script>
    <script src="https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/loader.js"></script>
</body>
</html>
